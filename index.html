<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

<!-- Will probably make navbar sticky. Not because I spilled coffee on it, though that dd also happen. -->
    <nav>
    </nav>
    

<!-- Here is your header. Title and about and whatnot. -->
<header>
    <h1>Welcome to the Game Club!</h1>
</header>

<!-- Main body. -->
 <section id="about" class="box">
    <h2>About the Game Club</h2>
    <p>This is some stuff about the club!</p>
 </section>

 <section id="schedule" class="box">
    <h2>Game Club Schedule</h2>
    <p>This is where I talk about the Game Club's schedule.</p>
 </section>

<section id="join" class="box">
    <h2>Join the Game Club!</h2>
    <p>This is where you can join our club!</p>

    <!-- The actual form to sign up -->
     <form>
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="email@domain.com" required>

        <label for="session">Which meetings are you available for?</label>
        <select id="session" name="session">
            <option value="">Choose a session</option>
            <option value="first">First Friday</option>
            <option value="third">Third Friday</option>
            <option value="either">Surprise Me!</option>
        </select>
        
        <label for="message">Anything else we should know?</label>
        <textarea id="message" name="message" rows="4">


        </textarea>
        <button type="submit">Sign Up!</button>

     </form>
</section>

<footer>Made by Bronson.</footer>

<script src="script.js"></script>

</body>
</html>
